image boot.vfat {
	vfat {
		files = {
			"bcm2712-rpi-5-b.dtb",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/overlays",
			"Image"
		}
	}

	size = 64M
}

image rockos-rpi5-sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext2"
	}
}
