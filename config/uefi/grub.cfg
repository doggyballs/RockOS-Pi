set timeout=0
set default=0

set gfxmode=auto
set gfxpayload=keep

insmod efi_gop
insmod gfxterm
insmod jpeg
insmod gfxterm_background
insmod chain

terminal_output gfxterm
background_image /EFI/BOOT/bootlogo.jpg

menuentry "RockOS" {
    search --no-floppy --label ROCKOSEFI --set=esp
    sleep 1
    chainloader ($esp)/EFI/BOOT/ROCKOS.EFI
    boot
}
